version: '3.8'

services:
  proxy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin-app
      - backend-api
      - public-renderer

  admin-app:
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: always
    environment:
      - VITE_API_URL=https://api.tvojeaplikace.cz
    ports:
      - "8080:80"

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-dev_super_secret_jwt_key_at_least_32_chars_long}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-0}"
      WEDOS_WAPI_USER: "${WEDOS_WAPI_USER:-}"
      WEDOS_WAPI_AUTH: "${WEDOS_WAPI_AUTH:-}"
      WEDOS_WAPI_TEST: "${WEDOS_WAPI_TEST:-1}"
    volumes:
      - backend_uploads:/var/www/html/var/uploads
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  public-renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-0}"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backend_uploads:
